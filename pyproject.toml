[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dndlights"
version = "0.2.0"
description = "Synchronized sound, LIFX light, and Spotify cues for tabletop play, controlled from any browser or by voice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.optional-dependencies]
voice = ["vosk>=0.3.45"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
dndlights = "dndlights.cli:main"

[tool.setuptools.packages.find]
include = ["dndlights*"]

[tool.setuptools.package-data]
dndlights = ["web/static/*"]
