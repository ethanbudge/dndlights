<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dndlights</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="statusbar">
  <div class="brand">dndlights</div>
  <div class="status">
    <span id="scene-status">no scene active</span>
  </div>
  <div class="controls">
    <select id="language-select" title="Voice trigger language"></select>
    <button id="listen-toggle" class="listen-btn">Listen: off</button>
  </div>
</header>

<nav id="tabs">
  <button class="tab-btn active" data-tab="scenes">Scenes</button>
  <button class="tab-btn" data-tab="spells">Spells</button>
  <button class="tab-btn" data-tab="effects">Effects</button>
  <button class="tab-btn" data-tab="custom">Custom</button>
  <button class="tab-btn" data-tab="settings">Settings</button>
</nav>

<main>
  <section id="tab-scenes" class="tab-panel active"><div class="grid" id="scenes-grid"></div></section>
  <section id="tab-spells" class="tab-panel"><div class="grid" id="spells-grid"></div></section>
  <section id="tab-effects" class="tab-panel"><div class="grid" id="effects-grid"></div></section>
  <section id="tab-custom" class="tab-panel">
    <div class="grid" id="custom-grid"></div>
    <form id="custom-form" class="settings-form">
      <h3>Add a custom button</h3>
      <label>ID (unique, no spaces) <input type="text" id="cb-id" required></label>
      <label>Label <input type="text" id="cb-label" required></label>
      <label>Light color <input type="color" id="cb-color" value="#8844ff"></label>
      <label>Brightness <input type="range" id="cb-brightness" min="0" max="1" step="0.01" value="0.5"></label>
      <label>Spotify playlist (URI, link, or ID) <input type="text" id="cb-playlist"></label>
      <button type="submit">Save button</button>
    </form>
  </section>
  <section id="tab-settings" class="tab-panel">
    <form id="settings-form" class="settings-form">
      <h3>Settings</h3>
      <label>LIFX personal access token <input type="password" id="s-lifx" placeholder="leave blank to keep current"></label>
      <label>Spotify Client ID <input type="text" id="s-spotify-id" placeholder="leave blank to keep current"></label>
      <label>Spotify Client Secret <input type="password" id="s-spotify-secret" placeholder="leave blank to keep current"></label>
      <label>Sounds directory (on this server) <input type="text" id="s-sounds-dir"></label>
      <label>Vosk model directory (for voice listening) <input type="text" id="s-vosk-dir"></label>
      <button type="submit">Save settings</button>
    </form>
    <p id="settings-status" class="hint"></p>
  </section>
</main>

<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
